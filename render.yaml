# Render Blueprint Specification (render.yaml)
# Deploy via: Render Dashboard -> Blueprints -> Connect Repository -> Apply
version: "1"

services:
  # --------------------------------------------------------------------------
  # 1. Backend REST API & WebSocket Service (Dockerized Express)
  # --------------------------------------------------------------------------
  - type: web
    name: hospital-backend
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set this in Render Dashboard (e.g. from free MongoDB Atlas)
      - key: JWT_ACCESS_SECRET
        generateValue: true # Render automatically generates secure random key
      - key: JWT_REFRESH_SECRET
        generateValue: true # Render automatically generates secure random key
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        fromService:
          type: static
          name: hospital-frontend
          property: url

  # --------------------------------------------------------------------------
  # 2. Frontend React SPA (Render Static Site with Global CDN & Free SSL)
  # --------------------------------------------------------------------------
  - type: static
    name: hospital-frontend
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hospital-backend
          property: url
          append: /api
      - key: VITE_WS_URL
        fromService:
          type: web
          name: hospital-backend
          property: url
