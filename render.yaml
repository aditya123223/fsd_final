version: "1"

services:
  # --------------------------------------------------------------------------
  # 1. Backend REST API & WebSocket Service (Dockerized Express)
  # --------------------------------------------------------------------------
  - type: web
    name: hospital-backend
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Enter your MongoDB Atlas URI when prompted in Render
      - key: JWT_ACCESS_SECRET
        generateValue: true # Render automatically generates a secure 32-char key
      - key: JWT_REFRESH_SECRET
        generateValue: true # Render automatically generates a secure 32-char key
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: "*"

  # --------------------------------------------------------------------------
  # 2. Frontend React SPA (Render Static Site)
  # --------------------------------------------------------------------------
  - type: web
    name: hospital-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://hospital-backend-bqkp.onrender.com/api
      - key: VITE_WS_URL
        value: https://hospital-backend-bqkp.onrender.com
