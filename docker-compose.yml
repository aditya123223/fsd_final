services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7-jammy
    container_name: hospital_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=hospital_db
    volumes:
      - mongo_data:/data/db
    networks:
      - hospital_network
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend Express Server Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hospital_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/hospital_db
      - JWT_ACCESS_SECRET=hospital_access_jwt_secret_dev_key_384729103847
      - JWT_REFRESH_SECRET=hospital_refresh_jwt_secret_dev_key_847291038472
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - FRONTEND_URL=http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - hospital_network

  # Frontend React (Vite + Nginx) Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
        - VITE_WS_URL=http://localhost:5000
    container_name: hospital_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - hospital_network

volumes:
  mongo_data:
    driver: local

networks:
  hospital_network:
    driver: bridge
